{% extends "base.html" %}

{% block title %}Reset Password - Brightloop Software{% endblock %}

{% block content %}
<div class="auth-wrapper my-2">
    <div class="row justify-content-center align-items-center">
        <div class="col-md-6 col-lg-5 col-xl-4">
            <div class="card shadow-lg border-0 auth-card">
                <div class="card-header text-white text-center py-4" style="background: linear-gradient(90deg, #7C3AED 0%, #EC4899 100%); border-bottom: none;">
                    <div class="mb-2"><i class="bi bi-key-fill fs-2 text-white"></i></div>
                    <h4 class="mb-0 fw-bold text-white">Reset Password</h4>
                    <small class="text-white-50">Brightloop Subscription Portal</small>
                </div>
                <div class="card-body p-4 bg-white">
                    <p class="text-muted small">Enter your email address and we'll send you instructions to reset your password.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary fw-semibold py-2">Send Reset Instructions</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3 small" style="background-color: #FAF5FF; color: #7C6A9C;">
                    <a href="{% url 'accounts:login' %}" class="fw-semibold text-primary">&larr; Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
