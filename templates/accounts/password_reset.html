{% extends "base.html" %}

{% block title %}Reset Password - Brightloop Software{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4">
    <div class="col-md-5 col-lg-4">
        <div class="card p-2">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold mb-1" style="color: #1F2937;">Reset Password</h3>
                    <p class="text-muted small mb-0">Enter your email address to receive reset instructions</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary py-2">Send Reset Instructions</button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-white border-top text-center py-3 small text-muted">
                <a href="{% url 'accounts:login' %}" class="fw-semibold">&larr; Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
