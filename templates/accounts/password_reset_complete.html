{% extends "base.html" %}

{% block title %}Password Reset Complete - Brightloop Software{% endblock %}

{% block content %}
<div class="auth-wrapper my-2">
    <div class="row justify-content-center align-items-center">
        <div class="col-md-6 col-lg-5 col-xl-4">
            <div class="card shadow-lg border-0 auth-card text-center p-4">
                <div class="mb-3">
                    <i class="bi bi-check-circle-fill text-success" style="font-size: 3.2rem;"></i>
                </div>
                <h4 class="fw-bold" style="color: #3B0764;">Password Reset Complete</h4>
                <p class="text-muted small mt-2">Your password has been set successfully. You may now sign in with your new credentials.</p>
                <div class="mt-4">
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary fw-semibold w-100">Sign In Now</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
