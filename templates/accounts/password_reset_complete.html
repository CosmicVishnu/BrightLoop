{% extends "base.html" %}

{% block title %}Password Reset Complete - Brightloop Software{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card p-4 text-center">
            <div class="mb-3">
                <i class="bi bi-check-circle text-muted" style="font-size: 2.5rem;"></i>
            </div>
            <h4 class="fw-bold mb-2">Password Reset Complete</h4>
            <p class="text-muted small mb-0">Your password has been set successfully. You may now sign in with your new credentials.</p>
            <div class="mt-4">
                <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 py-2">Sign In Now</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
